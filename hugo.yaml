baseurl: https://blog.zwindler.fr
languageCode: fr-fr
title: "Zwindler's Reflection"
enableRobotsTXT: true
buildFuture: false
copyright: "Licensed under CC BY-SA 4.0"

# config.yaml
module:
  imports:
    - path: github.com/CaiJimmy/hugo-theme-stack/v3

# Theme i18n support
# Available values: en, fr, id, ja, ko, pt-br, zh-cn, es, de, nl, it
DefaultContentLanguage: fr

pagination:
    pagerSize: 8
rssLimit: 8

permalinks:
    post: /p/:slug/
    page: /:slug/

taxonomies:
  category: "categories"
  tag: "tags"
  author: "authors"

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: "/misc/nyanonymous_rond.png"

    footer:
        since: 2010
        customText:

    dateFormat:
        published: 02 Jan 2006
        lastUpdated: 02 Jan 2006 15:04 CEST

    sidebar:
        subtitle: Blog d'un startuper 👨‍💻 punk à chat 🐱
        avatar:
            enabled: true
            local: true
            src: Denis_200x200.png

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-SA 4.0

    comments:
        enabled: false

    widgets:
        homepage:
            - type: search
            - type: rss
            - type: mailchimp
            - type: journal-hacker
            - type: archives
              params:
                  limit: 2
            - type: categories
              params:
                  limit: 10
        page:
            - type: search
            - type: toc

        tagCloud:
            limit: 24

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

### Custom menu
### See https://docs.stack.jimmycai.com/configuration/custom-menu.html
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main:
        - identifier: home
          name: Accueil
          url: /
          weight: -100
          params:
              ### For demonstration purpose, the home link will be open in a new tab
              newTab: false
              icon: home
    social:
        - identifier: github
          name: GitHub
          url: https://github.com/zwindler/zwindler
          params:
              icon: brand-github

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
