<ul>
<li>&quot;5 key metrics&quot;
<ul>
<li>Lead Time</li>

<li>Deployment Frequency</li>

</ul>

<h2>Culture d'entreprise</h2>
<p>Performers : culture de l'information, de l'apprentissage (CoP) et culture de la confiance (sécurité psychologique, <em>blameless</em>)</p>
<blockquote>
<p>High-trust and emphasizes information flow is predictive of software delivery performance and organizational performance in technology</p>
</blockquote>
<p><a href="https://www.youtube.com/watch?v=Nyga5cdvgbo">Pourquoi DevOps ne tient pas ses promesses ? (Gérôme Egron et Guillaume Mathieu)</a> / <a href="https://cloud.google.com/solutions/devops/devops-culture-westrum-organizational-culture">DORA - DevOps Culture</a></p>

<h2>Qui a inventé le SRE ? (1/2)</h2>
<ul>
<li>Ben Treynor Sloss (VP engineering @Google)</li>
<li>2003 (bien avant DevOps !)</li>
</ul>
<blockquote>
<p>SRE is what happens when you ask a <strong>software engineer</strong> to design an <strong>operations team</strong></p>
</blockquote>
<br />
<br />
<p><a href="https://sre.google/sre-book/introduction/">SRE book - Introduction</a></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="gaia" data-marpit-pagination="14" data-marpit-pagination-total="39" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="gaia" data-marpit-pagination="15" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;">
<h2>Qui a inventé le SRE ? (2/2)</h2>
<blockquote>
<ul>
<li>50–60% are Google Software Engineers</li>
<li>The other 40–50% are candidates who were very close to the qualifications, <strong>and who in addition</strong> had a set of skills useful to SRE but is rare for software engineers.</li>
</ul>
</blockquote>
<br />
<p><a href="https://sre.google/sre-book/introduction/">SRE book - Introduction</a><br />
<a href="https://www.youtube.com/playlist?list=PLIivdWyY5sqJrKl7D2u-gmis8h9K66qoj">Class SRE implements DevOps (playlist YouTube)</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="lead" data-theme="gaia" class="lead" data-marpit-pagination="16" data-marpit-pagination-total="39" style="--paginate:true;--class:lead;--theme:gaia;">
<h1>Les principes du SRE</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="gaia" data-marpit-pagination="17" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;">
<h2>Toil (tears and sweat)</h2>
<blockquote>
<p>Contrairement aux Ops (sic), les Devs détestent faire des tâches répétitives</p>
</blockquote>
<ul>
<li>Travail <strong>manuel</strong>, <strong>répétitif</strong>, <strong>automatisable</strong>, <strong>sans valeur ajoutée</strong>, <strong>augmente linéairement avec la capacité</strong></li>
<li>Réduit le moral des équipes, pas scalable ⇒ cercle vicieux</li>
</ul>
<br />
<p><a href="https://sre.google/sre-book/eliminating-toil/">SRE book - Eliminating toil</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="gaia" data-marpit-pagination="18" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;binaries/toil.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="18" data-paginate="true" data-theme="gaia" data-marpit-pagination="18" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2>Réduire le toil</h2>
<ul>
<li>Automatiser les tâches répétitives</li>
<li>Développer du tooling interne</li>
<li><strong>Documenter</strong>
<ul>
<li>ops &amp; astreinte</li>
</ul>
</li>
<li>Corriger les problèmes de fiabilité (post-incident)</li>
</ul>
<br />

<h2>CUJ / SLI / SLO</h2>
<blockquote>
<p>If reliability is a feature, how do you prioritize it instead of other features?</p>
</blockquote>
<ol>
<li>Déterminer des &quot;Critical User Journey&quot;</li>
<li>SLI: Indicateurs sur la fiabilité du service (dispo, latence)</li>
<li>SLO: Objectif de fiabilité du service (ex. 99,9% &lt; 30ms)</li>
</ol>
<p><a href="https://cloud.google.com/blog/products/management-tools/practical-guide-to-setting-slos">Practical Guide to setting SLOs</a> / <a href="https://medium.com/blablacar/slos-at-blablacar-59a126622c3e">SLOs at BlaBlaCar</a> / <a href="https://en.wikipedia.org/wiki/SMART_criteria">métriques S.M.A.R.T.</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="gaia" data-marpit-pagination="27" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;">
<h2>Error budgets</h2>
<p>On inverse la logique de la disponibilité</p>
<ul>
<li>Service accessible 99,9% <strong>==</strong> inaccessible 0,1% du temps</li>
</ul>
<br />
<blockquote>
<p>Une métrique objective qui permet de déterminer à quel point un service peut être non-fiable pendant une période donnée sans que ça n'impacte le business</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="gaia" data-marpit-pagination="28" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:30%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;binaries/mindblown.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="28" data-paginate="true" data-theme="gaia" data-marpit-pagination="28" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:30%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2>J'en fais quoi, <em>moi</em>, de ton Error Budget ?</h2>
<p>Contre-intuitivement... <strong>IL FAUT L'UTILISER</strong></p>
<ul>
<li>SLO atteint <strong>⇔</strong> utilisateurs contents (!!!)
<ul>
<li>Faire les interventions disruptives</li>
<li>Faire des tests &quot;risqués&quot;, chaos eng., etc.</li>
</ul>
</li>
<li>SLO pas atteint <strong>⇔</strong> pas <em>grave</em>
<ul>
<li>Prioriser <strong>tout</strong> ce qui améliore la fiabilité</li>
</ul>
</li>
</ul>
</section>

<h2>Dans quel cas ça ne marche pas ?</h2>
<ul>
<li>Les Errors Budgets sont une réponse <strong>organisationnelle</strong></li>
<li>Priorité aux nouvelles fonctionnalités si le service est &quot;fiable&quot;</li>
<li>Stakeholders qui n'adhèrent pas = intéret des principes SRE faible</li>

<h2>Ce qu'on attend d'un SRE</h2>
<ul>
<li>Déployer et <strong>maintenir l'infrastructure</strong></li>
<li><strong>Développer</strong> (tooling /réduire toil)</li>
<li><strong>Diffuser les bonnes pratiques</strong>
<ul>
<li>Monitoring / observabilité</li>
<li>Définir (ou aider à définir) les SLO/SLI/error budgets</li>
</ul>
</li>
<li>Être d'astreinte (+ post-mortems)</li>
</ul>
<p><a href="https://spike.sh/blog/sre-role-2021-analysed-30-job-postings">Spike - SRE 2021 / 30 job postings analysis</a> / <a href="https://twitter.com/memenetes/status/1316846480351809537?s=20">memenetes</a></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="gaia" data-marpit-pagination="32" data-marpit-pagination-total="39" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="gaia" data-marpit-pagination="33" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;">
<h2>Quelle &quot;personnalité&quot; pour être SRE ?</h2>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Totalement subjectif et probablement biaisé</strong> <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/></p>
<ul>
<li>Vouloir faire de l'infra (si on est Dev)</li>
<li>Ne pas avoir peur du code (si on est Ops)</li>
<li>Détester les tâches répétitives (<em><img class="emoji" draggable="false" alt="👋" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f44b.svg" data-marp-twemoji=""/> Ben Treynor Sloss</em>)</li>
<li>Être tenace, ...
<ul>
<li>... mais savoir rester réaliste !</li>
</ul>
</li>
<li><strong>Aimer transmettre / communiquer, faire preuve d'empathie</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="gaia" data-marpit-pagination="34" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:44%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;binaries/roadmap_to_devops_new.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="56%" height="720"><section id="34" data-paginate="true" data-theme="gaia" data-marpit-pagination="34" data-marpit-pagination-total="39" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:44%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2>Quelles compétences ?</h2>
<ul>
<li>Linux &amp; les bases en réseau</li>
<li>1 langage &amp; git</li>
<li>1 cloud provider</li>
<li>1 outil d'automatisation / IaC</li>
<li>1 outil de monitoring</li>
<li>Quelques outils &quot;Cloud-native&quot;</li>
</ul>
